# NACTA Attendance: HTTPS in front of the Node app (127.0.0.1:4000).
# Installed by deploy/linux/install.sh as /etc/nginx/conf.d/nacta-attendance.conf (__SERVER_NAME__ is filled in).
# ZKTeco terminals push to the app directly on port 8081 (plain HTTP), or, where the network blocks 8081, to port 80
# here (allow-listed by IP in /etc/nginx/nacta-attendance-devices.conf).

server {
    listen 80;
    listen [::]:80;
    server_name __SERVER_NAME__;
    server_tokens off;

    # Terminals on networks that cannot reach port 8081 push to port 80 instead: /iclock/ is passed to the device
    # receiver, but only from the addresses in the allow-list (sudo nacta-attendance allow-device <ip>).
    location /iclock/ {
        include /etc/nginx/nacta-attendance-devices.conf;
        deny all;
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header Connection "";
        # Biometric and photo uploads from the terminal.
        client_max_body_size 50m;
        proxy_read_timeout 120s;
    }

    # Everything else: browsers need HTTPS for the webcam (employee photos) and for the Secure session cookie.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name __SERVER_NAME__;

    ssl_certificate     /etc/nginx/ssl/nacta-attendance.crt;
    ssl_certificate_key /etc/nginx/ssl/nacta-attendance.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:nacta_ssl:10m;
    ssl_session_timeout 1d;
    server_tokens off;

    # Turn this on only once a certificate the browsers trust (NACTA CA or public CA) is installed;
    # with a self-signed certificate it would stop users from getting past the browser warning.
    # add_header Strict-Transport-Security "max-age=31536000" always;

    # Excel imports and photo uploads.
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        # Large Excel/PDF reports can take a while to build.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
